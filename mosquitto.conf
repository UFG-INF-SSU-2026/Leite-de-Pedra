persistence false

# O broker aceita somente MQTT sobre TLS. Os caminhos são relativos à raiz do
# projeto; inicie-o por scripts/iniciar-broker.sh para garantir o diretório.
listener 8883 127.0.0.1
allow_anonymous false

password_file .local/mqtt/mosquitto.passwd
acl_file mosquitto.acl

certfile .local/mqtt/broker.crt
keyfile .local/mqtt/broker.key
tls_version tlsv1.2

# Útil na demonstração do Marco 3: registra autenticações e acessos negados.
log_type error
log_type warning
log_type notice
log_type information
