[platformio]
workspace_dir = ../.local/wokwi-platformio

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    256dpi/MQTT@^2.5.2
    bblanchon/ArduinoJson@^6.21.5

[env:sensores]
build_src_filter = +<main.cpp> -<consumidor.cpp>

[env:intruso]
build_src_filter = +<main.cpp> -<consumidor.cpp>
build_flags = -DINTRUSO

[env:consumidor]
build_src_filter = +<consumidor.cpp> -<main.cpp>
lib_deps =
    ${env.lib_deps}
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
