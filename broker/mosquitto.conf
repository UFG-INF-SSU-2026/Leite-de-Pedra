persistence true
persistence_location .local/mosquitto/
max_queued_messages 10000

# O broker aceita somente MQTT sobre TLS. Os caminhos são relativos à raiz do
# projeto; inicie-o por broker/iniciar-broker.sh para garantir o diretório.
# O listener vem antes de qualquer opção de listener: se não, o Mosquitto cria
# um listener padrão na porta 1883, sem TLS e em todas as interfaces.
listener 8883 127.0.0.1
allow_anonymous false
use_username_as_clientid true

password_file .local/mqtt/mosquitto.passwd
acl_file broker/mosquitto.acl

certfile .local/mqtt/broker.crt
keyfile .local/mqtt/broker.key
tls_version tlsv1.2

# Útil na demonstração do Marco 3: registra autenticações e acessos negados.
log_type error
log_type warning
log_type notice
log_type information
